[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suns"
version = "1.0.0"
description = "Interpolate digitized optical-component loss curves and use them to correct a SUNS spectrometer/telescope calibration spectrum, per component and combined."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Guilherme Cavazzana" }]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/guicavazzana/suns"
Repository = "https://github.com/guicavazzana/suns"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/suns"]
